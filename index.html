<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#0f1720">
<title>Money</title>
<style>
html,body{margin:0;height:100%;background:#0f1720;color:#e8eef4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.c{width:100%;max-width:340px;text-align:center}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
p{color:#8aa0b4;font-size:14px;margin:0 0 22px}
input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid #2a3a4a;background:#16212c;color:#fff;font-size:17px;outline:none}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:#3d8bfd;color:#fff;font-size:17px;font-weight:600}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:#8aa0b4;font-size:14px}
.e{color:#ff7a7a;font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
<div class="w" id="g"><div class="c">
<h1>Dean's Money</h1><p>Private dashboard. Enter your password.</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
<label><input id="rm" type="checkbox" checked style="width:auto"> Remember on this device</label>
<button type="submit">Open</button><div class="e" id="er"></div></form>
</div></div>
<script>
const P={"s": "hryOw2qHfAFx43ZwPYNwSw==", "i": "CTTFEum7GC9fSski", "n": 3, "v": "9cWnpsxx"};
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='dean_money_key_v1';
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function ct(){let c='';for(let n=0;n<P.n;n++){const r=await fetch('c'+n+'.txt?v='+P.v,{cache:'no-store'});c+=(await r.text()).trim();}return b(c);}
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,await ct());
const h=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close();}
async function tryStored(){const raw=localStorage.getItem(K);if(!raw)return;try{const key=await crypto.subtle.importKey('raw',b(raw),'AES-GCM',true,['decrypt']);await open_(key);}catch(e){localStorage.removeItem(K);}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('er');er.textContent='Unlocking…';
try{const key=await derive(document.getElementById('pw').value);
if(document.getElementById('rm').checked){const r=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem(K,btoa(String.fromCharCode(...r)));}
await open_(key);}catch(x){er.textContent='Wrong password.';}};
tryStored();
</script></body></html>
